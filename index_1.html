<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3D1D0E"><meta name="apple-mobile-web-app-capable" content="yes"><title>Chéri Staff Book</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<style>
/* Layout: one-column phone app, sticky brand bar on top, fixed tab bar at the bottom; cards per staff member. */
:root {
  --bg: #F5EEE4; --surface: #FFFDF9; --sunk: #EFE5D8; --ink: #3D1D0E; --muted: #8A7461; --line: #E2D3BF;
  --accent: #B07A4A; --accent-ink: #FFFDF9; --good: #4F7A45; --good-bg: #E4EEDC; --warn: #A8701F; --warn-bg: #F6E8CF;
  --bad: #A9452F; --bad-bg: #F6DED6; --info: #5C6F8A; --info-bg: #E2E8F0;
  --font: "Open Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1C130D; --surface: #281C14; --sunk: #221810; --ink: #F3E9DC; --muted: #B6A28E; --line: #3D2D21;
  --accent: #D49C66; --accent-ink: #1C130D; --good: #93BA84; --good-bg: #253322; --warn: #E3B260; --warn-bg: #3A2D17;
  --bad: #E98670; --bad-bg: #3B211A; --info: #9DB2CF; --info-bg: #222B37; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1C130D; --surface: #281C14; --sunk: #221810; --ink: #F3E9DC; --muted: #B6A28E; --line: #3D2D21;
  --accent: #D49C66; --accent-ink: #1C130D; --good: #93BA84; --good-bg: #253322; --warn: #E3B260; --warn-bg: #3A2D17;
  --bad: #E98670; --bad-bg: #3B211A; --info: #9DB2CF; --info-bg: #222B37; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 110px; display: grid; gap: 14px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { height: 34px; width: auto; display: block; }
.logo.cream { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo.brown { display: none; } :root:not([data-theme="light"]) .logo.cream { display: block; } }
:root[data-theme="dark"] .logo.brown { display: none; } :root[data-theme="dark"] .logo.cream { display: block; }
.ttl { text-align: right; }
.ttl b { display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ttl span { font-size: 13px; color: var(--ink); font-weight: 600; }

h2 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 6px 2px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.datebar { display: flex; align-items: center; gap: 8px; }
.datebar input { flex: 1; min-width: 0; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
input[type=date], input[type=month], input[type=time], input[type=number], input[type=text], select {
  height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 12px; width: 100%; min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.staff { display: grid; gap: 10px; }
.sname { font-weight: 700; font-size: 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.c-good { background: var(--good-bg); color: var(--good); }
.c-warn { background: var(--warn-bg); color: var(--warn); }
.c-bad { background: var(--bad-bg); color: var(--bad); }
.c-info { background: var(--info-bg); color: var(--info); }
.c-mute { background: var(--sunk); color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed=true][data-s=present] { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.seg button[aria-pressed=true][data-s=half] { background: var(--info-bg); color: var(--info); border-color: var(--info); }
.seg button[aria-pressed=true][data-s=leave] { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.seg button[aria-pressed=true][data-s=absent] { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tbox { background: var(--sunk); border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; }
.tbox .lab { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.tbox input { height: 40px; background: var(--surface); }
.btn { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; font-weight: 600; cursor: pointer; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.full { width: 100%; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { background: none; border: 0; padding: 9px 4px 10px; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current=page] { color: var(--accent); }

.empty { text-align: center; padding: 28px 18px; }
.empty b { display: block; font-size: 17px; margin-bottom: 6px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--sunk) !important; }
tr.tot td { font-weight: 700; border-bottom: 0; }
td.neg { color: var(--bad); } td.pos { color: var(--good); }
.pay { display: grid; gap: 6px; }
.pay .l { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.pay .l.big { font-size: 18px; font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.note { font-size: 13px; color: var(--muted); }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; list-style: none; }
details summary::-webkit-details-marker { display: none; }
@media (max-width: 380px) { .stats { grid-template-columns: repeat(2, 1fr); } .seg button { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head><body>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbzHv8FnlSgA1PRva386fd4FpxYI-36Ap9ILApCUmgL2dyloId2sr-SKP2Jv6D48fgbZ6A/exec';

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toMin = hm => { if (!hm) return null; const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
const fmtHM = hm => { if (!hm) return '—'; let [h, m] = String(hm).split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const fmtDur = m => { m = Math.round(m || 0); if (!m) return '0m'; const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const rs = v => '₹' + Math.round(v || 0).toLocaleString('en-IN');
const rs2 = v => '₹' + (Math.round((v || 0) * 100) / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const monthOf = iso => iso.slice(0, 7);
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dayLabel = iso => new Date(iso + 'T00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); };
const shiftISO = (iso, d) => { const t = new Date(iso + 'T00:00'); t.setDate(t.getDate() + d); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let toastT;
const toast = (msg, ms = 2600) => { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); };
const distM = (a, b, c, d) => { const R = 6371000, r = x => x * Math.PI / 180, dl = r(c - a), dg = r(d - b); const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const locLabel = v => !v ? '' : String(v).startsWith('PC:') ? `on ${String(v).slice(3)}` : `${v} m from café`;

/* ---------- state ---------- */
const S = {
  token: LS.get('cheri-token'), me: null, staff: [], settings: {}, att: {}, months: new Set(),
  today: localToday(), tab: 'today', date: localToday(), month: monthOf(localToday()),
  kiosk: LS.get('cheri-kiosk'), busy: null, loading: false, editStaff: null, delConfirm: false, detail: null, geo: null, msg: '',
};
const STATUS = { present: 'Present', half: 'Half-day', leave: 'On leave', absent: 'Absent' };
const isAdmin = () => !!(S.me && S.me.isAdmin);

/* ---------- API ---------- */
async function api(action, data = {}) {
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error('The app is not connected yet. Paste your Apps Script URL into index.html.');
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, ...data }) });
  } catch { throw new Error('No connection. Check the internet and try again.'); }
  let j; try { j = await res.json(); } catch { throw new Error('The server did not answer properly. Try again in a minute.'); }
  if (!j.ok) { if (j.code === 'auth' && action !== 'login') { logoutLocal(); toast(j.error); } const e = new Error(j.error || 'Something went wrong'); e.code = j.code; throw e; }
  return j;
}
function putRecords(list) { (list || []).forEach(r => { S.att[r.id] = r; }); }
async function loadMonth(ym, force) {
  if (!S.token || (!force && S.months.has(ym))) return;
  S.months.add(ym);
  try { const j = await api('month', { month: ym }); Object.keys(S.att).forEach(k => { if (S.att[k].month === ym) delete S.att[k]; }); putRecords(j.records); render(); }
  catch (e) { S.months.delete(ym); toast(e.message); }
}
async function boot() {
  if (!S.token) { render(); return; }
  S.loading = true; render();
  try {
    const j = await api('bootstrap');
    S.me = j.me; S.staff = j.staff; S.settings = j.settings; S.today = j.today; S.date = j.today; S.month = monthOf(j.today);
    S.att = {}; putRecords(j.records); S.months = new Set([S.month]);
  } catch (e) { if (e.code !== 'auth') S.msg = e.message; }
  S.loading = false; render(); armIdle();
}
function logoutLocal() { S.lastUser = null; S.token = null; S.me = null; S.staff = []; S.att = {}; S.months = new Set(); S.tab = 'today'; S.editStaff = null; S.detail = null; LS.set('cheri-token', null); render(); }
async function logout() { try { await api('logout'); } catch {} logoutLocal(); }

/* café PC: log out after inactivity so the next person starts fresh */
let idleT;
function armIdle() { clearTimeout(idleT); if (S.kiosk && S.token) idleT = setTimeout(() => { logout(); toast('Logged out for the next person'); }, isAdmin() ? 300000 : 60000); }
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => S.kiosk && S.token && armIdle(), { passive: true }));

/* ---------- location ---------- */
function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ err: 'This browser cannot share location. Use the café PC instead.' });
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => res({ err: e.code === 1 ? 'Location permission is off. Allow location for this site, then try again. Or use the café PC.' : 'Could not get your location. Turn on GPS and try again, or use the café PC.' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

/* ---------- pay maths ----------
   Per-minute rate = hourly rate / 60 (₹60/hr → ₹1 a minute, so 15 min late = ₹15).
   Late = check-in after shift start (minus grace). Overtime = check-out after shift end.
   Day pay: present = full shift, half-day = half, leave = paid only if set, absent = 0. */
const rules = () => ({ otMult: Number(S.settings.otMult) || 1, grace: Number(S.settings.grace) || 0, leavePaid: S.settings.leavePaid === true || S.settings.leavePaid === 'true' });
function shiftMins(st) { let a = toMin(st.shiftStart), b = toMin(st.shiftEnd); if (a == null || b == null) return 0; if (b <= a) b += 1440; return b - a; }
function dayCalc(st, rec) {
  const R = rules(), out = { status: rec?.status || null, late: 0, ot: 0, worked: 0, base: 0, otPay: 0, ded: 0 };
  if (!rec || !rec.status) return out;
  const perMin = (Number(st.rate) || 0) / 60, sm = shiftMins(st);
  const s0 = toMin(st.shiftStart); let s1 = toMin(st.shiftEnd); if (s1 <= s0) s1 += 1440;
  if (rec.status === 'present' || rec.status === 'half') {
    out.base = (rec.status === 'half' ? sm / 2 : sm) * perMin;
    const i = toMin(rec.in);
    if (i != null) { out.late = Math.max(0, i - s0 - R.grace); if (i - s0 < -600) out.late = 0; }
    if (i != null && rec.out) {
      let o = toMin(rec.out); if (o < i) o += 1440;
      out.worked = o - i;
      out.ot = Math.max(0, o - (rec.status === 'half' ? s0 + sm / 2 : s1));
    }
    out.otPay = out.ot * perMin * R.otMult;
    out.ded = out.late * perMin;
  } else if (rec.status === 'leave' && R.leavePaid) out.base = sm * perMin;
  return out;
}
function monthCalc(st, ym) {
  const r = { present: 0, half: 0, leave: 0, absent: 0, late: 0, lateDays: 0, ot: 0, worked: 0, base: 0, otPay: 0, ded: 0, net: 0, days: [] };
  for (let d = 1; d <= daysIn(ym); d++) {
    const iso = `${ym}-${pad(d)}`, rec = S.att[`${iso}_${st.id}`], c = dayCalc(st, rec);
    if (c.status) r[c.status]++;
    r.late += c.late; if (c.late > 0) r.lateDays++;
    r.ot += c.ot; r.worked += c.worked; r.base += c.base; r.otPay += c.otPay; r.ded += c.ded;
    if (rec && rec.status) r.days.push({ iso, rec, c });
  }
  r.net = r.base + r.otPay - r.ded;
  return r;
}
const chipsFor = (rec, c) => {
  const out = [];
  if (rec && rec.status) out.push(`<span class="chip ${rec.status === 'present' ? 'c-good' : rec.status === 'half' ? 'c-info' : rec.status === 'leave' ? 'c-warn' : 'c-bad'}">${STATUS[rec.status]}</span>`);
  else out.push('<span class="chip c-mute">Not marked</span>');
  if (c.late > 0) out.push(`<span class="chip c-warn">Late ${fmtDur(c.late)} · −${rs2(c.ded)}</span>`);
  if (c.ot > 0) out.push(`<span class="chip c-good">OT ${fmtDur(c.ot)} · +${rs2(c.otPay)}</span>`);
  return out.join('');
};

  <h2>Check-in location</h2>

    <label class="f">Café name<input type="text" id="l_name" value="${esc(s.cafeName || '')}"></label>
    <div class="grid2"><label class="f">Latitude<input type="number" step="any" id="l_lat" value="${esc(s.cafeLat)}"></label><label class="f">Longitude<input type="number" step="any" id="l_lng" value="${esc(s.cafeLng)}"></label></div>
    <div class="grid2"><label class="f">Allowed distance (m)<input type="number" min="50" step="10" id="l_rad" value="${esc(s.radiusM || 400)}"></label><label class="f">Max GPS error (m)<input type="number" min="20" step="10" id="l_acc" value="${esc(s.maxAcc || 250)}"></label></div>
    <div class="grid2"><button class="btn" type="button" data-act="useHere">Use my location</button><button class="btn" type="button" data-act="testLoc">Test my distance</button></div>
    <button class="btn pri" type="submit">Save location</button>
  </form>
  <h2>Café PC</h2>
  <div class="card" style="display:grid;gap:12px">
    <div class="muted small">A registered café computer lets staff check in without phone location, for days when a phone has no GPS, no battery or no internet. It logs people out after one minute.</div>
    ${S.kiosk ? `<div class="banner" style="background:var(--good-bg);color:var(--good)">This device is registered as “${esc(S.kiosk.name)}”.</div><button class="btn" data-act="forgetKiosk">Stop using this device as café PC</button>` :
      `<form id="kioskForm" class="row" style="gap:8px"><input type="text" id="k_name" value="Café PC" class="sp" aria-label="Name for this computer"><button class="btn pri" type="submit">Register this computer</button></form>`}
    ${kiosks.length ? `<div style="display:grid;gap:8px">${kiosks.map(k => `<div class="row"><div class="sp"><b>${esc(k.name)}</b><div class="muted small">Added ${esc(new Date(k.addedAt).toLocaleDateString('en-IN'))}</div></div><button class="btn sm danger" data-act="removeKiosk" data-id="${k.id}">Remove</button></div>`).join('')}</div>` : '<div class="note">No café PC registered yet. Open this app on the café computer, log in as admin, and tap Register.</div>'}
  </div>
  <h2>My account</h2>
  <div class="card" style="display:grid;gap:8px"><div><b>${esc(S.me.name)}</b> <span class="muted small">@${esc(S.me.username)}</span></div><details><summary>Change my PIN</summary>${pinForm()}</details><button class="btn" data-act="logout">Log out</button></div>`;
}

function render() {
  const tabs = $('#tabs'), admin = isAdmin() && S.token;
  tabs.hidden = !admin;
  document.querySelectorAll('nav.tabs button').forEach(b => { b.removeAttribute('aria-current'); if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); });
  $('#hdrSub').textContent = S.me ? (S.kiosk ? 'Café PC · ' : '') + S.me.name : S.kiosk ? 'Café PC' : 'Attendance & payroll';
  const v = $('#view'), y = window.scrollY;
  v.style.paddingBottom = admin ? '' : '40px';
  if (!S.token) v.innerHTML = vLogin();
  else if (S.loading || !S.me) v.innerHTML = `<div class="card empty"><b>Loading…</b><span class="muted">Getting today's attendance.</span></div>${S.msg ? `<div class="banner">${esc(S.msg)}</div><button class="btn" data-act="logout">Log out</button>` : ''}`;
  else if (!admin) v.innerHTML = vMyDay();
  else v.innerHTML = S.tab === 'today' ? vToday() : S.tab === 'staff' ? vStaff() : S.tab === 'reports' ? vReports() : vSettings();
  window.scrollTo(0, y);
  updHint();
}
function updHint() {
  const h = $('#sf_hint'); if (!h) return;
  const st = { shiftStart: $('#sf_s').value, shiftEnd: $('#sf_e').value }, rate = Number($('#sf_rate').value) || 0, sm = shiftMins(st);
  h.textContent = sm ? `${fmtDur(sm)} shift · ₹${Math.round(sm / 60 * rate).toLocaleString('en-IN')} a full day · ₹${(rate / 60).toFixed(2)} a minute` : '';
}

/* ---------- export ---------- */
function saveFile(filename, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Downloaded ' + filename);
}
function exportRows(only) {
  const ym = S.month, list = S.staff.filter(s => only ? s.id === only : (s.active !== false || Object.values(S.att).some(r => r.month === ym && r.staffId === s.id)));
  const summary = [], daily = [];
  for (const st of list) {
    const m = monthCalc(st, ym);
    summary.push({ Staff: st.name, Role: st.role || '', 'Rate (₹/hr)': Number(st.rate) || 0, Shift: `${st.shiftStart}-${st.shiftEnd}`, Present: m.present, 'Half-day': m.half, Leave: m.leave, Absent: m.absent, 'Late (min)': Math.round(m.late), 'Late days': m.lateDays, 'Overtime (min)': Math.round(m.ot), 'Shift pay (₹)': +m.base.toFixed(2), 'OT pay (₹)': +m.otPay.toFixed(2), 'Late deduction (₹)': +m.ded.toFixed(2), 'Net payout (₹)': +m.net.toFixed(2) });
    for (const { iso, rec, c } of m.days) daily.push({ Date: iso, Staff: st.name, Status: STATUS[rec.status], 'Check-in': rec.in || '', 'Check-out': rec.out || '', 'Late (min)': Math.round(c.late), 'Overtime (min)': Math.round(c.ot), 'Worked (min)': Math.round(c.worked), Where: rec.inDist ? locLabel(rec.inDist) : rec.edited === 'TRUE' ? 'admin' : '', 'Day pay (₹)': +(c.base + c.otPay - c.ded).toFixed(2) });
  }
  daily.sort((a, b) => a.Date.localeCompare(b.Date) || a.Staff.localeCompare(b.Staff));
  return { summary, daily, list };
}
const fname = (only, list, ext) => `Cheri_Payroll_${S.month}${only && list[0] ? '_' + list[0].name.replace(/\W+/g, '_') : ''}.${ext}`;
function exportXlsx(only) {
  if (!window.XLSX) { toast('Excel export is still loading. Try again in a moment'); return; }
  const { summary, daily, list } = exportRows(only), wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(summary.length ? summary : [{ Staff: 'No staff' }]); ws1['!cols'] = Object.keys(summary[0] || { a: 1 }).map(k => ({ wch: Math.max(10, k.length + 2) }));
  const ws2 = XLSX.utils.json_to_sheet(daily.length ? daily : [{ Date: '', Staff: 'No entries' }]); ws2['!cols'] = [12, 20, 10, 10, 10, 11, 14, 13, 18, 12].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws1, 'Summary'); XLSX.utils.book_append_sheet(wb, ws2, 'Daily log');
  saveFile(fname(only, list, 'xlsx'), new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
function exportPdf(only) {
  const J = window.jspdf?.jsPDF; if (!J) { toast('PDF export is still loading. Try again in a moment'); return; }
  const { summary, daily, list } = exportRows(only), R = rules();
  const doc = new J({ orientation: 'landscape', unit: 'pt', format: 'a4' }), Rs = v => 'Rs ' + Math.round(v).toLocaleString('en-IN');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(61, 29, 14); doc.text('CHERI CAFE & EATERY', 40, 48);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(138, 116, 97);
  doc.text(`Attendance & payroll - ${monthLabel(S.month)}${only && list[0] ? ' - ' + list[0].name : ''}`, 40, 66);
  doc.text(`Rules: OT ${R.otMult}x, grace ${R.grace} min, leave ${R.leavePaid ? 'paid' : 'unpaid'}; late deduction = late minutes x (hourly rate / 60)`, 40, 82);
  const head = { fillColor: [61, 29, 14], textColor: [252, 250, 246], fontStyle: 'bold' }, alt = { fillColor: [245, 238, 228] };
  doc.autoTable({ startY: 98, headStyles: head, styles: { fontSize: 9, cellPadding: 5 }, alternateRowStyles: alt,
    head: [['Staff', 'Rate/hr', 'Present', 'Half', 'Leave', 'Absent', 'Late', 'OT', 'Shift pay', 'OT pay', 'Deduction', 'Net payout']],
    body: summary.map(s => [s.Staff, 'Rs ' + s['Rate (₹/hr)'], s.Present, s['Half-day'], s.Leave, s.Absent, fmtDur(s['Late (min)']), fmtDur(s['Overtime (min)']), Rs(s['Shift pay (₹)']), Rs(s['OT pay (₹)']), Rs(s['Late deduction (₹)']), Rs(s['Net payout (₹)'])]),
    foot: summary.length > 1 ? [['Total', '', '', '', '', '', '', '', ...['Shift pay (₹)', 'OT pay (₹)', 'Late deduction (₹)', 'Net payout (₹)'].map(k => Rs(summary.reduce((a, s) => a + s[k], 0)))]] : undefined,
    footStyles: { fillColor: [225, 210, 189], textColor: [61, 29, 14], fontStyle: 'bold' } });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(61, 29, 14); doc.text('Daily log', 40, doc.lastAutoTable.finalY + 30);
  doc.autoTable({ startY: doc.lastAutoTable.finalY + 40, headStyles: head, styles: { fontSize: 8.5, cellPadding: 4 }, alternateRowStyles: alt,
    head: [['Date', 'Staff', 'Status', 'Check-in', 'Check-out', 'Late', 'Overtime', 'Worked', 'Where', 'Day pay']],
    body: daily.length ? daily.map(d => [d.Date, d.Staff, d.Status, d['Check-in'] ? fmtHM(d['Check-in']) : '-', d['Check-out'] ? fmtHM(d['Check-out']) : '-', d['Late (min)'] ? fmtDur(d['Late (min)']) : '-', d['Overtime (min)'] ? fmtDur(d['Overtime (min)']) : '-', d['Worked (min)'] ? fmtDur(d['Worked (min)']) : '-', d.Where.replace('₹', 'Rs ') || '-', Rs(d['Day pay (₹)'])]) : [['No entries', '', '', '', '', '', '', '', '', '']] });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(138, 116, 97); doc.text(`Generated ${new Date().toLocaleString('en-IN')} - Page ${i} of ${n}`, 40, doc.internal.pageSize.getHeight() - 20); }
  saveFile(fname(only, list, 'pdf'), doc.output('blob'));
}

/* ---------- actions ---------- */
async function adminSet(st, patch) {
  const id = `${S.date}_${st.id}`, prev = S.att[id] || { id, staffId: st.id, date: S.date, month: monthOf(S.date), status: '', in: '', out: '' };
  const next = { ...prev, ...patch, edited: 'TRUE' };
  if (next.status === 'absent' || next.status === 'leave') { next.in = ''; next.out = ''; }
  S.att[id] = next; render();
  try { const j = await api('setAttendance', { staffId: st.id, date: S.date, status: next.status, in: next.in, out: next.out }); S.att[id] = j.record; render(); }
  catch (e) { S.att[id] = prev; render(); toast(e.message); }
}
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.detail = null; S.editStaff = null; if (S.tab === 'reports') loadMonth(S.month); render(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act, st = S.staff.find(s => s.id === t.dataset.id);
  try {
    if (a === 'logout') await logout();
    else if (a === 'punch') {
      const k = t.dataset.k; S.busy = k; render();
      let payload = { kind: k };
      if (S.kiosk) payload.kioskKey = S.kiosk.key;
      else { const p = await getPos(); if (p.err) { S.busy = null; render(); toast(p.err, 5000); return; } payload = { ...payload, lat: p.lat, lng: p.lng, acc: p.acc }; }
      try {
        const j = await api('punch', payload); S.att[j.record.id] = j.record;
        S.busy = null; render();
        toast(`Checked ${k} at ${fmtHM(k === 'in' ? j.record.in : j.record.out)}${S.kiosk ? '' : ` · ${j.distance} m from café`}`, 4000);
        if (S.kiosk && !isAdmin()) setTimeout(() => { if (S.token) logout(); }, 4000);
      } catch (e) { S.busy = null; render(); toast(e.message, 6000); }
    }
    else if (a === 'refresh') { await loadMonth(monthOf(S.date), true); toast('Updated'); }
    else if (a === 'prevDay' || a === 'nextDay') { S.date = shiftISO(S.date, a === 'prevDay' ? -1 : 1); render(); loadMonth(monthOf(S.date)); }
    else if (a === 'goToday') { S.date = S.today; render(); }
    else if (a === 'status' && st) await adminSet(st, { status: t.dataset.s });
    else if (a === 'clear' && st) { const id = `${S.date}_${st.id}`, prev = S.att[id]; delete S.att[id]; render(); try { await api('clearAttendance', { staffId: st.id, date: S.date }); } catch (e) { S.att[id] = prev; render(); toast(e.message); } }
    else if (a === 'newStaff') { S.tab = 'staff'; S.editStaff = { rate: 60, shiftStart: '11:00', shiftEnd: '20:00', active: true }; S.delConfirm = false; render(); window.scrollTo(0, 0); }
    else if (a === 'editStaff' && st) { S.editStaff = { ...st }; S.delConfirm = false; render(); window.scrollTo(0, 0); }
    else if (a === 'cancelStaff') { S.editStaff = null; render(); }
    else if (a === 'askDelete') { S.delConfirm = true; render(); }
    else if (a === 'cancelDelete') { S.delConfirm = false; render(); }
    else if (a === 'deleteStaff') {
      const purge = !!$('#del_purge')?.checked;
      await api('deleteStaff', { id: t.dataset.id, purge });
      S.staff = S.staff.filter(s => s.id !== t.dataset.id);
      if (purge) Object.keys(S.att).forEach(k => { if (S.att[k].staffId === t.dataset.id) delete S.att[k]; });
      S.editStaff = null; S.delConfirm = false; render(); toast('Staff member deleted');
    }
    else if (a === 'prevMonth' || a === 'nextMonth') { const [y, m] = S.month.split('-').map(Number); const d = new Date(y, m - 1 + (a === 'prevMonth' ? -1 : 1), 1); S.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; S.detail = null; render(); loadMonth(S.month); }
    else if (a === 'detail') { S.detail = t.dataset.id; render(); window.scrollTo(0, 0); }
    else if (a === 'closeDetail') { S.detail = null; render(); }
    else if (a === 'exportXlsx') exportXlsx(t.dataset.id);
    else if (a === 'exportPdf') exportPdf(t.dataset.id);
    else if (a === 'useHere' || a === 'testLoc') {
      t.disabled = true; const p = await getPos(); t.disabled = false;
      if (p.err) { toast(p.err, 5000); return; }
      if (a === 'useHere') { $('#l_lat').value = p.lat.toFixed(6); $('#l_lng').value = p.lng.toFixed(6); toast(`Filled in (±${Math.round(p.acc)} m). Tap Save location`); }
      else { const d = Math.round(distM(p.lat, p.lng, Number(S.settings.cafeLat), Number(S.settings.cafeLng))); toast(`${d} m from the café (±${Math.round(p.acc)} m) · ${d <= (S.settings.radiusM || 400) ? 'inside' : 'outside'} the zone`, 5000); }
    }
    else if (a === 'removeKiosk') { await api('removeKiosk', { id: t.dataset.id }); S.settings.kiosks = (S.settings.kiosks || []).filter(k => k.id !== t.dataset.id); render(); toast('Café PC removed'); }
    else if (a === 'forgetKiosk') { S.kiosk = null; LS.set('cheri-kiosk', null); render(); toast('This device is no longer the café PC'); }
  } catch (e) { toast(e.message, 5000); }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'dateIn' && t.value) { S.date = t.value; render(); loadMonth(monthOf(S.date)); }
  else if (t.id === 'monthIn' && t.value) { S.month = t.value; S.detail = null; render(); loadMonth(S.month); }
  else if (t.dataset.act === 'time') { const st = S.staff.find(s => s.id === t.dataset.id); if (st) await adminSet(st, { [t.dataset.k]: t.value }); }
});
document.addEventListener('input', ev => { if (/^sf_/.test(ev.target.id)) updHint(); });
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target.id;
  try {
    if (f === 'loginForm') {
      const username = $('#lg_user')?.value || '', pin = $('#lg_pin')?.value || '';
      S.lastUser = username; S.busy = 'login'; S.msg = ''; render();
      try {
        const j = await api('login', { username, pin });
        S.token = j.token; LS.set('cheri-token', j.token); if (!S.kiosk) LS.set('cheri-user', username.trim());
        S.busy = null; await boot();
      } catch (e) { S.busy = null; S.msg = e.message; render(); }
    } else if (f === 'pinForm') {
      await api('changePin', { oldPin: $('#pin_old').value, newPin: $('#pin_new').value }); toast('PIN changed'); render();
    } else if (f === 'staffForm') {
      const e = S.editStaff, body = { id: e.id, name: $('#sf_name').value, role: $('#sf_role').value, username: $('#sf_user').value, pin: $('#sf_pin').value || undefined, rate: Number($('#sf_rate').value) || 0, shiftStart: $('#sf_s').value, shiftEnd: $('#sf_e').value, isAdmin: $('#sf_admin').checked, active: $('#sf_active').checked };
      S.busy = 'staff'; render();
      try { const j = await api('saveStaff', { staff: body }); const i = S.staff.findIndex(s => s.id === j.staff.id); i >= 0 ? S.staff[i] = j.staff : S.staff.push(j.staff); if (j.staff.id === S.me.id) S.me = { ...S.me, ...j.staff }; S.editStaff = null; toast(e.id ? 'Saved' : `${j.staff.name} added · login @${j.staff.username}`); }
      finally { S.busy = null; render(); }
    } else if (f === 'rulesForm') {
      const j = await api('saveSettings', { settings: { otMult: Number($('#r_ot').value), grace: Number($('#r_grace').value), leavePaid: $('#r_leave').value === '1' } });
      S.settings = { ...S.settings, ...j.settings }; render(); toast('Pay rules saved');
    } else if (f === 'locForm') {
      const j = await api('saveSettings', { settings: { cafeName: $('#l_name').value, cafeLat: Number($('#l_lat').value), cafeLng: Number($('#l_lng').value), radiusM: Number($('#l_rad').value) || 400, maxAcc: Number($('#l_acc').value) || 250 } });
      S.settings = { ...S.settings, ...j.settings }; render(); toast('Location saved');
    } else if (f === 'kioskForm') {
      const j = await api('registerKiosk', { name: $('#k_name').value });
      S.kiosk = { key: j.kioskKey, name: j.kiosk.name, id: j.kiosk.id }; LS.set('cheri-kiosk', S.kiosk);
      S.settings.kiosks = [...(S.settings.kiosks || []), j.kiosk]; render(); toast('This computer is now the café PC');
    }
  } catch (e) { toast(e.message, 5000); }
});

boot();
})();
</script>

</body></html>
